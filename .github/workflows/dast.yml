name: DAST (ZAP baseline)

on:
  schedule:
    - cron: '0 6 * * 1'   # segundas, 03:00 BRT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ZAP baseline (somente regras passivas)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://vinshare-api.azurewebsites.net/api/v1/docs
          allow_issue_writing: false
          fail_action: false
          artifact_name: relatorio-zap
