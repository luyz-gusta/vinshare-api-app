name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep (relatório completo em SARIF)
        run: >
          semgrep scan --config p/java --config p/owasp-top-ten --config p/jwt --config p/secrets
          --sarif --output semgrep.sarif
      - name: Publicar no GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Gate (falha com achado de severidade ERROR)
        run: >
          semgrep scan --config p/java --config p/owasp-top-ten --config p/jwt --config p/secrets
          --severity ERROR --error

  build-test:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + testes (Testcontainers usa o Docker do runner)
        run: ./mvnw -B -ntp verify
      - name: Relatório de testes
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Testes JUnit
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
      - name: Resumo de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Cobertura de linhas (JaCoCo)\n\n%.1f%% (%d de %d linhas)\n", 100*c/(m+c), c, m+c}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/site/jacoco/
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/vinshare-api-0.0.1-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/classes/META-INF/sbom/application.cdx.json

  sca:
    name: SCA (Trivy sobre o SBOM)
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - name: Trivy (relatório SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: application.cdx.json
          format: sarif
          output: trivy-sca.sarif
      - name: Publicar no GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca
      - name: Gate (falha com CVE CRITICAL/HIGH que já tem correção)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: application.cdx.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  container:
    name: Container (Hadolint + Trivy imagem)
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Lint do Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Build da imagem
        run: docker build -t vinshare-api:${{ github.sha }} .
      - name: Trivy (relatório SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinshare-api:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Gate (CVE CRITICAL/HIGH corrigível na imagem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinshare-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  iac-scan:
    name: IaC e config (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: bicep,dockerfile,github_actions
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  deploy:
    name: Deploy (Azure App Service)
    # Só publica depois que a equipe configurar o OIDC no Azure e criar a variável de
    # repositório AZURE_DEPLOY_ENABLED=true; até lá o job fica "skipped", não vermelho.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    needs: [secret-scan, sast, build-test, sca, container, iac-scan]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vinshare-api.azurewebsites.net/api/v1/docs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vinshare-api
          package: vinshare-api-0.0.1-SNAPSHOT.jar
      - name: Smoke test (health)
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS https://vinshare-api.azurewebsites.net/api/v1/actuator/health | grep -q '"UP"'; then
              echo "API saudável"; exit 0
            fi
            sleep 10
          done
          echo "A API não respondeu UP em 5 minutos" >&2
          exit 1
