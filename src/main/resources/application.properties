# =============================================================================
# Ford VIN Share API
# =============================================================================

spring.application.name=vinshare-api
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

# =============================================================================
# Banco de dados (PostgreSQL)
# =============================================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vinshare}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Rotas inexistentes devolvem 404 (tratado em GlobalExceptionHandler) ao invés
# de cair no handler genérico de Exception (500).
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# =============================================================================
# Seed de dados sintéticos (DataSeeder). Ativar com SEED_ENABLED=true.
# =============================================================================
app.seed.enabled=${SEED_ENABLED:false}

# =============================================================================
# Notificações proativas (NotificationService + jobs @Scheduled).
# Ativar com NOTIFICATIONS_ENABLED=true.
# =============================================================================
app.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
app.notifications.cron.free-revision=0 0 9 * * *
app.notifications.cron.nps=0 0 * * * *
app.notifications.cron.km=0 30 9 * * *

# =============================================================================
# Política de retenção (Cyber, frente 4). Ativar com RETENTION_ENABLED=true.
# Chat com 90 dias e audit log com 180 dias por padrão.
# =============================================================================
app.retention.enabled=${RETENTION_ENABLED:false}
app.retention.chat-days=${RETENTION_CHAT_DAYS:90}
app.retention.audit-days=${RETENTION_AUDIT_DAYS:180}
app.retention.cron=0 30 3 * * *

# =============================================================================
# Flyway
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Segurança (JWT, BCrypt, CORS)
# =============================================================================
security.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-com-no-minimo-64-caracteres-aleatorios}
security.jwt.access-token-minutes=${JWT_ACCESS_MIN:15}
security.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}
security.jwt.issuer=ford-vinshare-api

security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,exp://localhost:19000}

# Chaves de criptografia de dados sensíveis (CPF)
security.encryption.cpf-aes-key=${CPF_AES_KEY:}
security.encryption.cpf-hmac-key=${CPF_HMAC_KEY:}

# Rate limit (Bucket4j)
security.rate-limit.default-capacity=120
security.rate-limit.default-refill-tokens=120
security.rate-limit.default-refill-minutes=1
security.rate-limit.login-capacity=10
security.rate-limit.login-refill-tokens=10
security.rate-limit.login-refill-minutes=1
security.rate-limit.chat-capacity=20
security.rate-limit.chat-refill-tokens=20
security.rate-limit.chat-refill-minutes=1

# Assinatura de payloads (HMAC-SHA256 em endpoints sensíveis)
security.payload-signature.key=${PAYLOAD_SIGNATURE_KEY:}
security.payload-signature.header=X-Request-Signature
security.payload-signature.protected-paths=PATCH /appointments/*/complete,POST /leads/*/actions

# Auditoria e detecção de eventos suspeitos
security.audit.bulk-query-threshold=100
security.audit.login-failure-threshold=5
security.audit.login-failure-window-minutes=10

# =============================================================================
# Swagger / OpenAPI
# =============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# =============================================================================
# Actuator
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Ford VIN Share, Challenge FIAP 2026

# =============================================================================
# Logs (JSON estruturado configurado em logback-spring.xml)
# =============================================================================
logging.level.root=INFO
logging.level.com.fiap.vinshare=INFO
logging.level.org.hibernate.SQL=WARN

# =============================================================================
# Integrações externas
# =============================================================================
integrations.gemini.api-key=${GEMINI_API_KEY:}
integrations.gemini.model=gemini-3.6-flash
integrations.expo.access-token=${EXPO_ACCESS_TOKEN:}

# =============================================================================
# Multipart
# =============================================================================
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
