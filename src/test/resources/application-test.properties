# Perfil de teste: datasource vem do Testcontainers via @DynamicPropertySource.
app.seed.enabled=false
app.notifications.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
logging.level.org.hibernate.SQL=WARN

# Chaves exclusivas de teste (nunca usadas fora do Testcontainers).
security.jwt.secret=chave-de-teste-com-no-minimo-sessenta-e-quatro-caracteres-aleatorios-1234567890
security.encryption.cpf-aes-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
security.encryption.cpf-hmac-key=chave-hmac-de-teste-nao-usar-em-producao

# Integrações externas desligadas: o chat usa a resposta simulada e o push só loga,
# mesmo que o .env local do desenvolvedor tenha chaves reais.
integrations.gemini.api-key=
integrations.expo.access-token=

# Limites altos: a suíte faz muitos logins pelo mesmo IP (127.0.0.1).
# O comportamento do rate limit é testado em RateLimitTest com limites baixos.
security.rate-limit.default-capacity=100000
security.rate-limit.default-refill-tokens=100000
security.rate-limit.login-capacity=100000
security.rate-limit.login-refill-tokens=100000
security.rate-limit.chat-capacity=100000
security.rate-limit.chat-refill-tokens=100000
